name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the exact release
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uvx ruff check .
      - run: uv run pytest
