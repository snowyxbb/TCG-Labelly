[project]
name = "labelly"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "reportlab>=5.1.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
